<!-- Questions Block -->
<div class="bg-emerald-50/80 p-5 rounded-2xl border-2 border-saudiFlag/30 space-y-6">
    
    <!-- Part 1 -->
    <div>
        <label class="block text-base md:text-lg font-black text-saudiDark leading-relaxed mb-2">
            كيف نغرس حب الوطن في أطفالنا دون أن نتحدث عنه؟ *
        </label>
        <textarea id="answer1" rows="3" required placeholder="اكتب إجابتك هنا..." class="w-full px-4 py-3 bg-white border-2 border-emerald-200 rounded-xl focus:border-saudiFlag focus:ring-2 focus:ring-saudiFlag/20 focus:outline-none transition text-slate-700 font-medium"></textarea>
    </div>

    <hr class="border-emerald-200">

    <!-- Part 2 -->
    <div>
        <label class="block text-base md:text-lg font-black text-saudiDark leading-relaxed mb-2">
            شاركونا موقفًا من حياتكم اليومية يُعلّم طفلكم حب الوطن… دون أن تقولوا كلمة «وطن». *
        </label>
        <textarea id="answer2" rows="3" required placeholder="اكتب موقفك هنا..." class="w-full px-4 py-3 bg-white border-2 border-emerald-200 rounded-xl focus:border-saudiFlag focus:ring-2 focus:ring-saudiFlag/20 focus:outline-none transition text-slate-700 font-medium mb-4"></textarea>
        
        <!-- Media Upload Block -->
        <div class="bg-white p-4 rounded-xl border border-emerald-200">
            <label class="block text-sm font-bold text-slate-700 mb-2">
                إرفاق وسائط (اختياري):
            </label>
            <div class="text-sm font-bold text-emerald-800 mb-3 flex items-center gap-2 flex-wrap">
                <span>🎙️ بالصوت</span>
                <span class="text-slate-300">|</span>
                <span>📸 بالصورة</span>
                <span class="text-slate-300">|</span>
                <span>🎥 بالفيديو</span>
            </div>
            <input type="file" id="mediaFile" accept="image/*,audio/*,video/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-emerald-100 file:text-saudiDark hover:file:bg-emerald-200 cursor-pointer">
        </div>
    </div>

</div>
