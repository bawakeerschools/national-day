<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاركينا فرحة الوطن | مدارس بواكير</title>
    
    <!-- Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Section -->
    <header class="bg-emerald-800 text-white py-8 px-4 text-center shadow-lg border-b-4 border-amber-400">
        <h1 class="text-3xl md:text-4xl font-black mb-2">شاركينا فرحة الوطن 🇸🇦</h1>
        <p class="text-emerald-100 text-sm md:text-base">مدارس بواكير (فرع الروابي) - التعبير عن معاني الحب والولاء لتراب هذا الوطن المعطاء</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-8 space-y-8">

        <!-- Form Section -->
        <section class="bg-white rounded-2xl shadow-md p-6 md:p-8 border border-emerald-100">
            <h2 class="text-xl font-bold text-emerald-900 mb-6 border-r-4 border-emerald-600 pr-3">إضافة مشاركة جديدة</h2>
            
            <form id="nationalDayForm" class="space-y-4">
                <div>
                    <label for="studentName" class="block text-sm font-medium text-gray-700 mb-1">اسم الطالبات / المشاركات</label>
                    <input type="text" id="studentName" required placeholder="أدخلي الاسم..." 
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                </div>

                <div>
                    <label for="grade" class="block text-sm font-medium text-gray-700 mb-1">الصف / المرحلة</label>
                    <input type="text" id="grade" placeholder="مثال: الصف الأول الابتدائي" 
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">كلمة للوطن / المشاركة</label>
                    <textarea id="message" rows="3" required placeholder="اكتبي مشاعرك وعباراتك الجميلة..." 
                              class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"></textarea>
                </div>

                <button type="submit" id="submitBtn" 
                        class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center space-x-2 space-x-reverse">
                    <span>إرسال المشاركة</span>
                </button>
            </form>
        </section>

        <!-- Display Messages Section -->
        <section class="bg-white rounded-2xl shadow-md p-6 md:p-8 border border-emerald-100">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-emerald-900 border-r-4 border-amber-500 pr-3">سجل المشاركات والتهاني</h2>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <span id="countBadge" class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full">0 مشاركة</span>
                    <button onclick="promptAdminDelete()" class="text-xs text-red-500 hover:underline">حذف مشاركة</button>
                </div>
            </div>

            <!-- List Container -->
            <div id="messagesList" class="space-y-4">
                <div class="text-center py-8 text-gray-400">
                    جاري تحميل المشاركات...
                </div>
            </div>
        </section>

    </main>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, getDocs } 
               from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (قاعدة بياناتك الخاصة)
        const firebaseConfig = {
            apiKey: "AIzaSyDk6c6HgwYiyz-E3ZLSAafDWpX4pwSaABc",
            authDomain: "bawakeer-nationalday.firebaseapp.com",
            projectId: "bawakeer-nationalday",
            storageBucket: "bawakeer-nationalday.firebasestorage.app",
            messagingSenderId: "384568251456",
            appId: "1:384568251456:web:2deb4ea151a241068e7ba5",
            measurementId: "G-MF6TQBXEM8"
        };

        // Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsRef = collection(db, "posts");

        // DOM Elements
        const form = document.getElementById("nationalDayForm");
        const submitBtn = document.getElementById("submitBtn");
        const messagesList = document.getElementById("messagesList");
        const countBadge = document.getElementById("countBadge");

        // Submit Form Event
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const studentName = document.getElementById("studentName").value.trim();
            const grade = document.getElementById("grade").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!studentName || !message) return;

            // UI Disable
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الحفظ في النظام...";

            try {
                await addDoc(postsRef, {
                    name: studentName,
                    grade: grade || "غير محدد",
                    message: message,
                    createdAt: serverTimestamp()
                });

                form.reset();
                alert("تم إرسال مشاركتك وحفظها بنجاح! 🇸🇦");
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "إرسال المشاركة";
            }
        });

        // Real-time Listener to Fetch Data
        const q = query(postsRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            messagesList.innerHTML = "";
            countBadge.innerText = `${snapshot.docs.length} مشاركة`;

            if (snapshot.empty) {
                messagesList.innerHTML = `<div class="text-center py-8 text-gray-400">لا توجد مشاركات حتى الآن. كوني أول المشاركات!</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement("div");
                card.className = "p-4 rounded-xl bg-emerald-50/50 border border-emerald-100 hover:border-emerald-300 transition relative";

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-emerald-950">${escapeHTML(data.name)}</h3>
                            <span class="text-xs text-emerald-700">${escapeHTML(data.grade)}</span>
                        </div>
                        <span class="text-[10px] text-gray-400">🇸🇦</span>
                    </div>
                    <p class="text-gray-800 text-sm leading-relaxed">${escapeHTML(data.message)}</p>
                `;
                messagesList.appendChild(card);
            });
        });

        // Admin Delete Function using hardcoded password (47455)
        window.promptAdminDelete = async function() {
            const pass = prompt("أدخلي كلمة مرور المشرفة للحذف:");
            if (pass !== "47455") {
                if (pass !== null) alert("كلمة المرور غير صحيحة!");
                return;
            }

            try {
                const querySnapshot = await getDocs(postsRef);
                if (querySnapshot.empty) {
                    alert("لا توجد مشاركات للحذف.");
                    return;
                }

                let listStr = "اختر رقم المشاركة للحذف:\n";
                const docsArr = querySnapshot.docs;
                docsArr.forEach((d, idx) => {
                    listStr += `${idx + 1}. ${d.data().name}: ${d.data().message.substring(0, 20)}...\n`;
                });

                const choice = prompt(listStr);
                if (choice !== null && !isNaN(choice)) {
                    const index = parseInt(choice) - 1;
                    if (index >= 0 && index < docsArr.length) {
                        await deleteDoc(doc(db, "posts", docsArr[index].id));
                        alert("تم حذف المشاركة بنجاح.");
                    } else {
                        alert("رقم غير صحيح.");
                    }
                }
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء عملية الحذف.");
            }
        };

        // Helper function to prevent XSS
        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }
    </script>
</body>
</html>
